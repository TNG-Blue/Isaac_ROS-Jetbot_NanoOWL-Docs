<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <!-- SPDX-License-Identifier: Apache-2.0 · Copyright (c) 2025 TNG-Blue -->
  <title id="t">Isaac ROS Jetbot NanoOWL</title>
  <desc id="d">Open-vocabulary perception with NanoOWL on a Jetson, closed-loop flight control of a
    coaxial X12 hexacopter on the JetOwl FC, and the links between the phone, the Remote UAV, the FC, the Jetson and JetOwl Vision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030507"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="nv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="0.5" stop-color="#b4f000"/>
      <stop offset="1" stop-color="#76b900"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#76b900" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <clipPath id="view"><rect x="700" y="48" width="530" height="330" rx="10"/></clipPath>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#76b900"/>
    </marker>
    <!-- Coaxial X12 rotor pair (Gazebo/ROS2_Hexacopter_*): upper and lower propellers on one
         arm, counter-rotating; the lower one drawn dimmer and wider -->
    <g id="disc"><circle r="19" fill="#76b900" fill-opacity="0.08" stroke="#76b900" stroke-opacity="0.5"/></g>
    <rect id="blade" x="-18" y="-2.2" width="36" height="4.4" rx="2.2"/>
    <rect id="bladeLow" x="-18" y="-1.6" width="36" height="3.2" rx="1.6"/>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="960" cy="230" rx="420" ry="260" fill="url(#glow)"/>

  <!-- ───────────── Title ───────────── -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="60" y="104" font-size="52" fill="#ffffff" letter-spacing="5">ISAAC ROS</text>
    <text x="56" y="182" font-size="76" fill="url(#nv)" letter-spacing="1">JETBOT</text>
    <text x="56" y="258" font-size="76" fill="url(#nv)" letter-spacing="1">NanoOWL</text>
  </g>
  <text x="60" y="302" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="23" fill="#c9d1d9">
    Open-vocabulary perception · closed-loop autonomy
  </text>
  <g font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#97d700">
    <rect x="60" y="324" width="160" height="34" rx="17" fill="#0a0e14" stroke="#76b900" stroke-width="1.6"/>
    <text x="140" y="346" text-anchor="middle">ROS 2 Humble</text>
    <rect x="232" y="324" width="196" height="34" rx="17" fill="#0a0e14" stroke="#76b900" stroke-width="1.6"/>
    <text x="330" y="346" text-anchor="middle">Orin Nano Super</text>
    <rect x="440" y="324" width="214" height="34" rx="17" fill="#0a0e14" stroke="#76b900" stroke-width="1.6"/>
    <text x="547" y="346" text-anchor="middle">CUDA · TensorRT</text>
  </g>

  <!-- ───────────── NanoOWL camera view ───────────── -->
  <rect x="700" y="48" width="530" height="330" rx="10" fill="#05080c" stroke="#76b900" stroke-width="2"/>
  <g clip-path="url(#view)">
    <!-- ground in perspective -->
    <g stroke="#76b900" stroke-opacity="0.22" stroke-width="1">
      <path d="M700 300H1230M700 330H1230M700 362H1230"/>
      <path d="M965 260L760 378M965 260L860 378M965 260L965 378M965 260L1070 378M965 260L1170 378"/>
    </g>
    <path d="M700 268H1230" stroke="#76b900" stroke-opacity="0.35"/>
    <!-- scanning line -->
    <rect x="700" y="48" width="530" height="60" fill="url(#scan)">
      <animate attributeName="y" values="20;340;20" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- a person walking (side view, turns at each end), detected; the box follows unmirrored -->
    <g transform="translate(724 186)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                        values="724 186;796 186;796 186;724 186;724 186" keyTimes="0;0.45;0.5;0.95;1"/>
      <g transform="translate(22 0)">
        <g>
          <animateTransform attributeName="transform" type="scale" dur="8s" repeatCount="indefinite"
                            calcMode="discrete" values="1 1;-1 1" keyTimes="0;0.5"/>
          <g transform="translate(-22 0)" stroke="#3d444d" stroke-width="8" stroke-linecap="round">
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0"
                                dur="0.45s" repeatCount="indefinite"/>
              <!-- far arm and leg, darker -->
              <path d="M22 36V64" stroke="#262c33">
                <animateTransform attributeName="transform" type="rotate" values="28 22 36;-28 22 36;28 22 36"
                                  dur="0.9s" repeatCount="indefinite"/>
              </path>
              <path d="M22 74V110" stroke="#262c33">
                <animateTransform attributeName="transform" type="rotate" values="-26 22 74;26 22 74;-26 22 74"
                                  dur="0.9s" repeatCount="indefinite"/>
              </path>
              <!-- torso and head -->
              <rect x="13" y="28" width="18" height="48" rx="8" fill="#3d444d" stroke="none"/>
              <circle cx="24" cy="14" r="11" fill="#3d444d" stroke="none"/>
              <!-- near leg and arm -->
              <path d="M22 74V110">
                <animateTransform attributeName="transform" type="rotate" values="26 22 74;-26 22 74;26 22 74"
                                  dur="0.9s" repeatCount="indefinite"/>
              </path>
              <path d="M22 36V64">
                <animateTransform attributeName="transform" type="rotate" values="-28 22 36;28 22 36;-28 22 36"
                                  dur="0.9s" repeatCount="indefinite"/>
              </path>
            </g>
          </g>
        </g>
      </g>
      <rect x="-8" y="-6" width="60" height="126" fill="none" stroke="#00d4ff" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-9" y="-28" width="132" height="22" fill="#00d4ff"/>
      <text x="-3" y="-12" font-family="'Courier New', monospace" font-size="15" font-weight="700"
            fill="#001218">a person 0.87</text>
    </g>

    <!-- the JetOwl coaxial X12 hexacopter, flying, with its box following it -->
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="spline"
                     keyTimes="0;0.33;0.66;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                     values="0,0;90,-14;30,30;0,0"/>
      <g transform="translate(1000 205)">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0;0 -4;0 0" dur="1.2s" repeatCount="indefinite"/>
        <!-- arms at azimuth 30° + 60°·i from the nose (up); rotor pair at R = 52 -->
        <path d="M0 0L26.0 -45.0 M0 0L52.0 -0.0 M0 0L26.0 45.0 M0 0L-26.0 45.0 M0 0L-52.0 0.0 M0 0L-26.0 -45.0" stroke="#97d700" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(26.0 -45.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <g transform="translate(52.0 -0.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <g transform="translate(26.0 45.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <g transform="translate(-26.0 45.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <g transform="translate(-52.0 0.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <g transform="translate(-26.0 -45.0)">
          <use href="#disc"/>
          <g fill="#76b900" opacity="0.55"><use href="#bladeLow"/><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="0.27s" repeatCount="indefinite"/></g>
          <g fill="#c8ff4d" opacity="0.9"><use href="#blade"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.24s" repeatCount="indefinite"/></g>
          <circle r="3" fill="#0d1117" stroke="#c8ff4d"/>
        </g>
        <path d="M0 -20L17 -10V10L0 20L-17 10V-10Z" fill="#0d1117" stroke="#c8ff4d" stroke-width="2"/>
        <path d="M0 -15L-4 -8H4Z" fill="#c8ff4d"/>
        <circle cx="0" cy="0" r="3.5" fill="#00ff88">
          <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
        </circle>
        <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#76b900" stroke-width="2.5"/>
        <rect x="-81" y="-104" width="160" height="22" fill="#76b900"/>
        <text x="-75" y="-88" font-family="'Courier New', monospace" font-size="15" font-weight="700"
              fill="#0a0e14">a hexacopter 0.92</text>
      </g>
    </g>
  </g>
  <!-- viewfinder corners -->
  <g stroke="#c8ff4d" stroke-width="3" fill="none">
    <path d="M714 86V62H738M1216 86V62H1192M714 340V364H738M1216 340V364H1192"/>
  </g>
  <!-- header: model, prompt, REC -->
  <rect x="701" y="49" width="528" height="30" fill="#0a0e14" fill-opacity="0.85"/>
  <circle cx="720" cy="64" r="6" fill="#ff4d4d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="734" y="70" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#97d700">
    NanoOWL · OWL-ViT · TensorRT FP16
  </text>
  <text x="1212" y="70" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">
    sm_87
  </text>
  <text x="716" y="402" font-family="'Courier New', monospace" font-size="17" fill="#c9d1d9">
    prompt: [a hexacopter, a person, a backpack]
    <tspan fill="#c8ff4d">▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- ───────────── Devices and links (jetowl_system) ───────────── -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" text-anchor="middle">
    <g fill="#0a0e14" stroke="#76b900" stroke-width="2">
      <rect x="40" y="440" width="190" height="64" rx="10"/>
      <rect x="282" y="440" width="190" height="64" rx="10"/>
      <rect x="524" y="440" width="190" height="64" rx="10"/>
      <rect x="766" y="440" width="214" height="64" rx="10" stroke="url(#nv)" stroke-width="3"/>
      <rect x="1032" y="440" width="208" height="64" rx="10"/>
    </g>
    <g font-size="20" font-weight="800" fill="#ffffff">
      <text x="135" y="467">Phone app</text>
      <text x="377" y="467">Remote UAV</text>
      <text x="619" y="467">JetOwl FC</text>
      <text x="873" y="467">Jetson · Isaac ROS</text>
      <text x="1136" y="467">JetOwl Vision</text>
    </g>
    <g font-size="15" fill="#97d700" font-family="'Courier New', monospace">
      <text x="135" y="491">JetbotNanoOWL</text>
      <text x="377" y="491">GIGA R1 · LR1121</text>
      <text x="619" y="491">STM32N657 · 12 BLDC</text>
      <text x="873" y="491">ESKF · MPC · NanoOWL</text>
      <text x="1136" y="491">STM32N657 · IMX335</text>
    </g>
    <g font-size="14" fill="#8b949e" font-family="'Courier New', monospace">
      <text x="256" y="430">USB/BLE</text>
      <text x="498" y="430">LoRa</text>
      <text x="740" y="430">micro-ROS</text>
      <text x="1006" y="430">micro-ROS</text>
    </g>
  </g>
  <!-- links with packets travelling both ways -->
  <g stroke="#76b900" stroke-width="2" stroke-opacity="0.6">
    <path d="M230 472H282M472 472H524M714 472H766M980 472H1032"/>
  </g>
  <g>
    <circle r="5" fill="#c8ff4d">
      <animateMotion path="M230 466H282" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00d4ff">
      <animateMotion path="M282 478H230" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#c8ff4d">
      <animateMotion path="M472 466H524" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00d4ff">
      <animateMotion path="M524 478H472" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00d4ff">
      <animateMotion path="M714 478H766" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#c8ff4d">
      <animateMotion path="M766 466H714" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00d4ff">
      <animateMotion path="M1032 478H980" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#c8ff4d">
      <animateMotion path="M980 466H1032" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ───────────── Closed loop ───────────── -->
  <g font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#97d700" text-anchor="middle">
    <text x="130" y="566">sensor</text>
    <text x="345" y="566">filter</text>
    <text x="565" y="566">estimator</text>
    <text x="805" y="566">controller</text>
    <text x="1040" y="566">actuator</text>
  </g>
  <g stroke="#76b900" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M180 560H296"/>
    <path d="M395 560H500"/>
    <path d="M630 560H732"/>
    <path d="M878 560H978"/>
  </g>
  <path id="loop" d="M1100 560H1200V600H70V572" stroke="#76b900" stroke-width="2" stroke-dasharray="6 6"
        fill="none" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <text x="640" y="622" text-anchor="middle" font-family="'Courier New', monospace" font-size="15"
        fill="#8b949e">feedback: measured state, not the command</text>
  <circle r="6" fill="#00ff88">
    <animateMotion dur="4s" repeatCount="indefinite"
                   path="M70 560H1200V600H70Z"/>
  </circle>
</svg>
