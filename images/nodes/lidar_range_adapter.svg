<text x="41" y="386" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Gazebo HexacopterSystem → /scan, /lpb40b/scan → lidar_range_adapter → /range, /imu/data → lidar_slam_node (slam/pose) +</text>
