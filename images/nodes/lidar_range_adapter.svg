<text x="41" y="418" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   climb-rate loops → 12 rotors → body motion → sensors</text>
<text x="41" y="434" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Status: Closed in simulation on the vehicle's own estimates, never on ground truth (slam_gazebo.launch.py, flight:=pilot);</text>
