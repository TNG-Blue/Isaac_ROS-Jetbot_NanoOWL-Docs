<text x="41" y="543" font-size="13.5" fill="#5A0F1A" text-anchor="start" font-weight="bold">Loop 8e · GNSS-free navigation and return to home</text>
<text x="41" y="573" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">ground_vo_node → /vo/twist → uav_state_estimator → /estimator/nav_health → flight_controller_node → flight/setpoint →</text>
<text x="41" y="589" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   uav_trajectory_controller → /control/attitude_setpoint → jetowl_fc → … → /imu/data → uav_state_estimator →</text>
<text x="41" y="605" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   /odometry/filtered → nav_map_node → /nav/return_path → flight_controller_node</text>
<text x="41" y="621" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Status: Closed. With GNSS distrusted, the camera + LPB40B velocity keeps the ENU estimate (and home) valid; a GNSS attack or</text>
<text x="41" y="637" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   lost fix with healthy navigation → RTH along the flown path, σ_h above its bound → LAND (ros2_gnss_denied_nav README)</text>
