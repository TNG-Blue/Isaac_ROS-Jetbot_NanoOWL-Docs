<text x="41" y="664" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">/imu/data → uav_state_estimator (ESKF) → /odometry/filtered → uav_trajectory_controller (MPC) → /control/attitude_setpoint +</text>
<text x="41" y="680" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   /control/thrust → jetowl_fc → loop 2 → IMU → /imu/data</text>
<text x="41" y="696" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Status: Closed, over micro-ROS/UDP</text>
<rect x="30" y="724" width="880" height="130" rx="8" fill="#FFFFFF" stroke="#C8364A" stroke-width="1.4"/>
<rect x="30" y="724" width="880" height="30" rx="8" fill="#F9E0E4"/>
<rect x="30" y="746" width="880" height="8" fill="#F9E0E4"/>
<text x="41" y="744" font-size="13.5" fill="#5A0F1A" text-anchor="start" font-weight="bold">Loop 8b · RF / GNSS link security (JetOwl)</text>
<text x="41" y="774" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">jetowl_fc → /jetowl/security/{rf_link,gnss} → link_security (detection only) → /jetowl/security/threat → flight_controller_node</text>
<text x="41" y="790" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   (GNSS attack → LAND, command link jammed and lost → RTH) → /jetowl/security/response → uav_state_estimator (stops fusing a</text>
<text x="41" y="806" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   distrusted receiver) → /jetowl/security/advice → jetowl_fc (/gps/fix NO_FIX for that receiver) → next epochs measured again</text>
<text x="41" y="822" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Status: Closed. The FC only lowers GNSS trust; every flight decision stays on the Jetson (JetOwl_FlightControl</text>
<text x="41" y="838" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   docs/ARCHITECTURE.md §9, docs/SECURITY.md)</text>
