<text x="41" y="778" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   uav_state_estimator (/odometry/filtered) → sil_pilot (per-axis position/velocity loop) → /hexa/cmd → plugin attitude and</text>
<text x="41" y="794" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">   climb-rate loops → 12 rotors → body motion → sensors</text>
<text x="41" y="810" font-size="12" fill="#5A0F1A" text-anchor="start" font-weight="normal">Status: Closed in simulation on the vehicle's own estimates, never on ground truth (slam_gazebo.launch.py, flight:=pilot);</text>
