<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="800" viewBox="0 0 1380 800" font-family="Helvetica, Arial, sans-serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="24" font-size="15" font-weight="bold">jetowl_system — communication interfaces</text>
<text x="16" y="42" fill="#444">Each device is a subsystem of jetowl_system.slx; each arrow is a comm_net_link block (delay = P.net.&lt;link&gt;.total_steps ms) in a network subsystem.</text>
